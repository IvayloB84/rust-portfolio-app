name: Build and Push Rust Container Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting & lints
        run: |
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          IMAGE_PATH="ghcr.io/${{ github.repository }}"
          echo "name=$(echo "$IMAGE_PATH" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ steps.image.outputs.name }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push image
        run: |
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

  update-gitops-manifest:
    needs: [rust-quality, build-and-push, secret-scan, dockerfile-lint, sast-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: IvayloB84/ArgoCD-RootApps
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Bump image tag in Deployment manifest
        run: |
          cd gitops-repo
          sed -i "s#image: ghcr.io/.*#image: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}#" \
            argocd-apps/${{ github.event.repository.name }}/deployment.yaml

      - name: Commit and push
        run: |
          cd gitops-repo
          git config user.name "backstage-bot"
          git config user.email "backstage-bot@users.noreply.github.com"
          git add argocd-apps/${{ github.event.repository.name }}/deployment.yaml
          git diff --cached --quiet && echo "No image change to commit" || \
            git commit -m "chore(deploy): ${{ github.event.repository.name }}@${{ github.sha }}"
          git push origin main