[package]
name = "rust-portfolio-server"
version = "0.1.0"
edition = "2024"

[dependencies]
portfolio-core = { path = "../portfolio-core" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }

